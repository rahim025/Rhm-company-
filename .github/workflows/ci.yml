name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API — build & tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rhm
          POSTGRES_PASSWORD: rhm_password
          POSTGRES_DB: rhm_base
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rhm -d rhm_base"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://rhm:rhm_password@localhost:5432/rhm_base?schema=public
      JWT_SECRET: ci_test_secret_do_not_use_in_production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/api/package.json

      - name: Install dependencies
        working-directory: apps/api
        run: npm install

      - name: Generate Prisma client
        working-directory: apps/api
        run: npx prisma generate

      - name: Run migrations
        working-directory: apps/api
        run: npx prisma migrate deploy

      - name: Type-check & build
        working-directory: apps/api
        run: npm run build

      - name: Run tests
        working-directory: apps/api
        run: npm test

  dashboard:
    name: Dashboard — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/dashboard/package.json

      - name: Install dependencies
        working-directory: apps/dashboard
        run: npm install

      - name: Build
        working-directory: apps/dashboard
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
        run: npm run build
